<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RCP Juice Lab — Desk Pre-Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function CustomerApp() {
      const [ingredients, setIngredients] = useState([]);
      const [signatureBlends, setSignatureBlends] = useState([]);
      const [loading, setLoading] = useState(true);
      const [stockAlert, setStockAlert] = useState(null);

      const [activeTab, setActiveTab] = useState("SIGNATURE");
      const [selectedBaseId, setSelectedBaseId] = useState(null);
      const [selectedMixinIds, setSelectedMixinIds] = useState([]);
      const [selectedBoosterId, setSelectedBoosterId] = useState(null);

      const [checkoutItem, setCheckoutItem] = useState(null);
      const [customerName, setCustomerName] = useState("");
      const [deskLocation, setDeskLocation] = useState("");
      const [pickupType, setPickupType] = useState("EXPRESS DESK");
      const [mealCardOption, setMealCardOption] = useState("ZETA");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(null);

      const wsRef = useRef(null);
      const reconnectRef = useRef(null);

      // 1. Fetch Live Catalog & Stock on Mount
      useEffect(() => {
        fetch("/api/catalog")
          .then(res => res.json())
          .then(data => {
            setIngredients(data.ingredients || []);
            setSignatureBlends(data.signatureBlends || []);

            // Pick initial available defaults
            const firstBase = (data.ingredients || []).find(i => i.category === "Base" && i.available);
            const firstMixin = (data.ingredients || []).find(i => i.category === "Mix-in" && i.available);
            if (firstBase) setSelectedBaseId(firstBase.id);
            if (firstMixin) setSelectedMixinIds([firstMixin.id]);
            setLoading(false);
          })
          .catch(err => {
            console.error("Failed to load catalog:", err);
            setLoading(false);
          });
      }, []);

      // 2. Live WebSocket Listener for Real-Time Stock Sync
      useEffect(() => {
        const connectWs = () => {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          const host = window.location.host || "localhost:4000";
          const ws = new WebSocket(`${protocol}//${host}/kds-stream`);
          wsRef.current = ws;

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data.type === "INIT_QUEUE" && Array.isArray(data.ingredients)) {
                setIngredients(data.ingredients);
              } else if (data.type === "STOCK_CHANGED") {
                setIngredients(prev =>
                  prev.map(item =>
                    item.id === data.ingredientId ? { ...item, available: data.available } : item
                  )
                );
              }
            } catch (e) {
              console.error("WS parse error:", e);
            }
          };

          ws.onclose = () => {
            reconnectRef.current = setTimeout(connectWs, 4000);
          };
        };

        connectWs();
        return () => {
          if (wsRef.current) wsRef.current.close();
          if (reconnectRef.current) clearTimeout(reconnectRef.current);
        };
      }, []);

      // 3. Auto-Clean Selections If an Ingredient Goes Out of Stock Live
      useEffect(() => {
        if (ingredients.length === 0) return;

        // Check selected base
        const currentBase = ingredients.find(i => i.id === selectedBaseId);
        if (currentBase && !currentBase.available) {
          const nextAvailableBase = ingredients.find(i => i.category === "Base" && i.available);
          setSelectedBaseId(nextAvailableBase ? nextAvailableBase.id : null);
          triggerAlert(`${currentBase.name} just ran out at the counter.`);
        }

        // Check selected mix-ins
        const validMixins = selectedMixinIds.filter(id => {
          const item = ingredients.find(i => i.id === id);
          if (item && !item.available) {
            triggerAlert(`${item.name} just ran out and was removed from your blend.`);
            return false;
          }
          return true;
        });
        if (validMixins.length !== selectedMixinIds.length) {
          setSelectedMixinIds(validMixins);
        }

        // Check selected booster
        if (selectedBoosterId) {
          const currentBooster = ingredients.find(i => i.id === selectedBoosterId);
          if (currentBooster && !currentBooster.available) {
            setSelectedBoosterId(null);
            triggerAlert(`${currentBooster.name} just ran out and was removed.`);
          }
        }
      }, [ingredients]);

      const triggerAlert = (msg) => {
        setStockAlert(msg);
        setTimeout(() => setStockAlert(null), 5000);
      };

      const bases = useMemo(() => ingredients.filter(i => i.category === "Base"), [ingredients]);
      const mixins = useMemo(() => ingredients.filter(i => i.category === "Mix-in"), [ingredients]);
      const boosters = useMemo(() => ingredients.filter(i => i.category === "Booster"), [ingredients]);

      const selectedBase = bases.find(b => b.id === selectedBaseId) || null;
      const selectedMixins = mixins.filter(m => selectedMixinIds.includes(m.id));
      const selectedBooster = boosters.find(b => b.id === selectedBoosterId) || null;

      // Dynamic Nutrient & Price Calculation
      const customMetrics = useMemo(() => {
        let cal = selectedBase ? (selectedBase.caloriesPer100g * selectedBase.defaultGrams) / 100 : 0;
        let sug = selectedBase ? (selectedBase.sugarPer100g * selectedBase.defaultGrams) / 100 : 0;
        let price = 120;

        selectedMixins.forEach(m => {
          cal += (m.caloriesPer100g * m.defaultGrams) / 100;
          sug += (m.sugarPer100g * m.defaultGrams) / 100;
        });

        if (selectedBooster) {
          cal += (selectedBooster.caloriesPer100g * selectedBooster.defaultGrams) / 100;
          price += selectedBooster.price || 0;
        }

        return {
          calories: Math.round(cal),
          sugar: Math.round(sug),
          price
        };
      }, [selectedBase, selectedMixins, selectedBooster]);

      const toggleMixin = (item) => {
        if (!item.available) return;
        if (selectedMixinIds.includes(item.id)) {
          setSelectedMixinIds(selectedMixinIds.filter(id => id !== item.id));
        } else if (selectedMixinIds.length < 2) {
          setSelectedMixinIds([...selectedMixinIds, item.id]);
        }
      };

      const handleStartCustomCheckout = () => {
        if (!selectedBase) return;
        const recipeList = [
          { id: selectedBase.id, name: selectedBase.name, grams: selectedBase.defaultGrams },
          ...selectedMixins.map(m => ({ id: m.id, name: m.name, grams: m.defaultGrams }))
        ];
        if (selectedBooster) {
          recipeList.push({ id: selectedBooster.id, name: selectedBooster.name, grams: selectedBooster.defaultGrams });
        }

        setCheckoutItem({
          targetTitle: `Custom (${selectedBase.name.split(" ")[0]} + ${selectedMixins.map(m => m.name.split(" ")[0]).join("/")})`,
          price: customMetrics.price,
          calories: customMetrics.calories,
          recipe: recipeList
        });
      };

      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        if (!customerName.trim()) return alert("Please enter your name");

        setIsSubmitting(true);
        const orderPayload = {
          customerName: deskLocation ? `${customerName} (${deskLocation})` : customerName,
          pickupType,
          targetTitle: checkoutItem.targetTitle,
          calories: checkoutItem.calories,
          recipe: checkoutItem.recipe
        };

        try {
          const res = await fetch("/api/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(orderPayload)
          });
          const data = await res.json();

          if (res.status === 409) {
            triggerAlert(data.error);
            setCheckoutItem(null);
            return;
          }

          if (data.success) {
            setOrderSuccess(data.order);
            setCheckoutItem(null);
          } else {
            throw new Error(data.error || "Order failed");
          }
        } catch (err) {
          alert("Could not reach the counter server. Please check your connection.");
        } finally {
          setIsSubmitting(false);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-neutral-950 flex items-center justify-center text-neutral-400 text-sm font-semibold">
            Loading live menu...
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-neutral-950 pb-24 border-x border-neutral-900 shadow-2xl">
          {/* LIVE STOCK TOAST NOTIFICATION */}
          {stockAlert && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm bg-red-950 border border-red-500 text-red-100 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center justify-between">
              <span>⚠️ {stockAlert}</span>
              <button onClick={() => setStockAlert(null)} className="ml-3 text-red-300 font-black">✕</button>
            </div>
          )}

          {/* HEADER */}
          <header className="p-5 border-b border-neutral-900 bg-neutral-900/40 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span className="text-[10px] font-black uppercase tracking-widest text-emerald-400">RCP Campus Lab</span>
              </div>
              <h1 className="text-lg font-black tracking-tight text-white mt-0.5">Fresh Cold-Pressed</h1>
            </div>
            <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-[11px] font-bold text-neutral-300">
              ⚡ &lt;60s Pickup
            </div>
          </header>

          {/* MODE SELECTOR TABS */}
          <div className="p-4 bg-neutral-950 sticky top-[69px] z-20">
            <div className="grid grid-cols-2 p-1 bg-neutral-900 rounded-xl border border-neutral-800">
              <button
                onClick={() => setActiveTab("SIGNATURE")}
                className={`py-2 text-xs font-black rounded-lg transition ${
                  activeTab === "SIGNATURE" 
                    ? "bg-neutral-800 text-white shadow-md" 
                    : "text-neutral-400 hover:text-white"
                }`}
              >
                Workday Blends
              </button>
              <button
                onClick={() => setActiveTab("CUSTOM")}
                className={`py-2 text-xs font-black rounded-lg transition ${
                  activeTab === "CUSTOM" 
                    ? "bg-emerald-600 text-white shadow-md shadow-emerald-950" 
                    : "text-neutral-400 hover:text-white"
                }`}
              >
                Build Your Own 🧪
              </button>
            </div>
          </div>

          {/* TAB 1: SIGNATURE WORKDAY BLENDS */}
          {activeTab === "SIGNATURE" && (
            <div className="px-4 space-y-3.5">
              <p className="text-[11px] font-semibold text-neutral-400 px-1">
                Timed for your workday rhythm. No added sugar or ice.
              </p>

              {signatureBlends.map((blend) => {
                // Check if any ingredient required by this blend is marked OUT
                const missingItems = (blend.ingredientIds || [])
                  .map(id => ingredients.find(i => i.id === id))
                  .filter(item => item && !item.available);
                const isBlendAvailable = missingItems.length === 0;

                return (
                  <div 
                    key={blend.id}
                    className={`p-4 rounded-2xl border transition flex flex-col justify-between ${
                      isBlendAvailable
                        ? "bg-neutral-900/70 border-neutral-800/80 hover:border-neutral-700"
                        : "bg-neutral-900/30 border-red-900/40 opacity-65"
                    }`}
                  >
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        {isBlendAvailable ? (
                          <span className="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                            {blend.timeSlot} • {blend.tagline}
                          </span>
                        ) : (
                          <span className="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded bg-red-500/15 border border-red-500/30 text-red-400">
                            Out of {missingItems[0].name}
                          </span>
                        )}
                        <span className="text-sm font-black font-mono text-white">
                          ₹{blend.price}
                        </span>
                      </div>
                      <h3 className="text-base font-bold text-white mt-1.5">{blend.name}</h3>
                      <p className="text-xs text-neutral-400 mt-1 leading-relaxed">{blend.desc}</p>
                    </div>

                    <div className="mt-4 pt-3 border-t border-neutral-800/60 flex items-center justify-between">
                      <div className="text-[11px] font-mono text-neutral-400">
                        <strong>{blend.calories}</strong> kcal • <strong>{blend.sugar}g</strong> nat. sugars
                      </div>
                      <button
                        disabled={!isBlendAvailable}
                        onClick={() => setCheckoutItem({
                          targetTitle: blend.name,
                          price: blend.price,
                          calories: blend.calories,
                          recipe: blend.recipe
                        })}
                        className={`px-4 py-1.5 text-xs font-bold rounded-lg border transition ${
                          isBlendAvailable
                            ? "bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-white border-neutral-700"
                            : "bg-neutral-900 text-neutral-600 border-neutral-800 cursor-not-allowed"
                        }`}
                      >
                        {isBlendAvailable ? "Pre-Order" : "Sold Out"}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* TAB 2: MODULAR 3-STEP CUSTOMIZER */}
          {activeTab === "CUSTOM" && (
            <div className="px-4 space-y-6">
              {/* LIVE MACRO BAR */}
              <div className="p-3.5 rounded-xl bg-neutral-900 border border-neutral-800 flex items-center justify-between shadow-lg">
                <div>
                  <span className="text-[10px] uppercase font-bold text-neutral-400 tracking-wider">Live Profile</span>
                  <div className="flex items-baseline gap-2 mt-0.5">
                    <span className="text-xl font-black text-amber-400 font-mono">{customMetrics.calories}</span>
                    <span className="text-xs text-neutral-400">kcal</span>
                    <span className="text-neutral-600">•</span>
                    <span className="text-sm font-bold text-neutral-300 font-mono">{customMetrics.sugar}g</span>
                    <span className="text-xs text-neutral-400">sugars</span>
                  </div>
                </div>
                <div className="text-right">
                  <span className="text-[10px] uppercase font-bold text-neutral-400 tracking-wider">Total</span>
                  <p className="text-xl font-black text-white font-mono">₹{customMetrics.price}</p>
                </div>
              </div>

              {/* STEP 1: LIQUID BASE */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">1. Select Liquid Base (60%)</h4>
                  <span className="text-[10px] text-emerald-400 font-bold">Pick 1</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {bases.map(b => {
                    const isSelected = selectedBaseId === b.id;
                    return (
                      <div
                        key={b.id}
                        onClick={() => b.available && setSelectedBaseId(b.id)}
                        className={`p-3 rounded-xl border text-left transition select-none ${
                          !b.available
                            ? "bg-red-950/15 border-red-900/30 text-neutral-600 cursor-not-allowed opacity-60"
                            : isSelected 
                            ? "bg-emerald-500/15 border-emerald-500 text-white font-bold cursor-pointer" 
                            : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700 cursor-pointer"
                        }`}
                      >
                        <div className="flex justify-between items-start gap-1">
                          <p className={`text-xs leading-tight ${!b.available ? "line-through" : ""}`}>{b.name}</p>
                          {!b.available && (
                            <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 shrink-0">OUT</span>
                          )}
                        </div>
                        <span className="text-[10px] font-mono text-neutral-400 block mt-1">{b.caloriesPer100g} kcal/100g</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* STEP 2: MIX-INS */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">2. Select Mix-Ins (40%)</h4>
                  <span className="text-[10px] text-neutral-400 font-bold">{selectedMixinIds.length}/2 Selected</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {mixins.map(m => {
                    const isSelected = selectedMixinIds.includes(m.id);
                    return (
                      <div
                        key={m.id}
                        onClick={() => toggleMixin(m)}
                        className={`p-3 rounded-xl border text-left transition select-none ${
                          !m.available
                            ? "bg-red-950/15 border-red-900/30 text-neutral-600 cursor-not-allowed opacity-60"
                            : isSelected 
                            ? "bg-emerald-500/15 border-emerald-500 text-white font-bold cursor-pointer" 
                            : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700 cursor-pointer"
                        }`}
                      >
                        <div className="flex justify-between items-start gap-1">
                          <p className={`text-xs leading-tight ${!m.available ? "line-through" : ""}`}>{m.name}</p>
                          {!m.available && (
                            <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 shrink-0">OUT</span>
                          )}
                        </div>
                        <span className="text-[10px] font-mono text-neutral-400 block mt-1">{m.caloriesPer100g} kcal/100g</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* STEP 3: BOOSTERS */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">3. Superfood Booster</h4>
                  <span className="text-[10px] text-neutral-400 font-bold">Optional</span>
                </div>
                <div className="space-y-2">
                  {boosters.map(bst => {
                    const isSelected = selectedBoosterId === bst.id;
                    return (
                      <div
                        key={bst.id}
                        onClick={() => bst.available && setSelectedBoosterId(isSelected ? null : bst.id)}
                        className={`p-3 rounded-xl border text-left transition select-none flex justify-between items-center ${
                          !bst.available
                            ? "bg-red-950/15 border-red-900/30 text-neutral-600 cursor-not-allowed opacity-60"
                            : isSelected 
                            ? "bg-amber-500/15 border-amber-500 text-white font-bold cursor-pointer" 
                            : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700 cursor-pointer"
                        }`}
                      >
                        <span className={`text-xs ${!bst.available ? "line-through" : ""}`}>
                          {bst.name} (+₹{bst.price})
                        </span>
                        {bst.available ? (
                          <span className="text-[10px] font-mono text-neutral-400">
                            +{Math.round((bst.caloriesPer100g * bst.defaultGrams) / 100)} kcal
                          </span>
                        ) : (
                          <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-500/20 text-red-400">OUT</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* BOTTOM CTA */}
              <button
                onClick={handleStartCustomCheckout}
                disabled={!selectedBase || selectedMixins.length === 0}
                className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 active:scale-98 disabled:opacity-40 disabled:cursor-not-allowed text-white font-black text-sm uppercase tracking-wide rounded-xl shadow-xl shadow-emerald-950 transition"
              >
                Review &amp; Desk Pickup (₹{customMetrics.price})
              </button>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {checkoutItem && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-neutral-800 pb-4">
                  <div>
                    <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400">Confirm Order</span>
                    <h3 className="text-lg font-bold text-white mt-0.5">{checkoutItem.targetTitle}</h3>
                    <p className="text-xs font-mono text-neutral-400 mt-0.5">₹{checkoutItem.price} • {checkoutItem.calories} kcal</p>
                  </div>
                  <button onClick={() => setCheckoutItem(null)} className="text-neutral-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={handlePlaceOrder} className="mt-5 space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Your Name</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Rahul Sharma"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-sm text-white focus:outline-none focus:border-emerald-500 font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Office Bay / Floor (Optional)</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Building 4, Bay 2B"
                      value={deskLocation}
                      onChange={(e) => setDeskLocation(e.target.value)}
                      className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-sm text-white focus:outline-none focus:border-emerald-500 font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Pickup Style</label>
                    <div className="grid grid-cols-2 gap-2 mt-1.5">
                      <button
                        type="button"
                        onClick={() => setPickupType("EXPRESS DESK")}
                        className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition ${
                          pickupType === "EXPRESS DESK" 
                            ? "bg-cyan-500/20 text-cyan-300 border-cyan-500" 
                            : "bg-neutral-950 text-neutral-400 border-neutral-800"
                        }`}
                      >
                        ⚡ Express Rack (&lt;60s)
                      </button>
                      <button
                        type="button"
                        onClick={() => setPickupType("COUNTER PICKUP")}
                        className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition ${
                          pickupType === "COUNTER PICKUP" 
                            ? "bg-emerald-500/20 text-emerald-300 border-emerald-500" 
                            : "bg-neutral-950 text-neutral-400 border-neutral-800"
                        }`}
                      >
                        Counter Handover
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Payment Method</label>
                    <div className="grid grid-cols-3 gap-2 mt-1.5">
                      {["ZETA", "PLUXEE", "UPI"].map(m => (
                        <button
                          key={m}
                          type="button"
                          onClick={() => setMealCardOption(m)}
                          className={`py-2 rounded-lg border text-xs font-black transition ${
                            mealCardOption === m 
                              ? "bg-neutral-100 text-neutral-950 border-white" 
                              : "bg-neutral-950 text-neutral-400 border-neutral-800"
                          }`}
                        >
                          {m}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-4 mt-2 bg-emerald-600 hover:bg-emerald-500 active:scale-98 disabled:opacity-50 text-white font-black text-sm uppercase tracking-wide rounded-xl shadow-lg transition"
                  >
                    {isSubmitting ? "Dispatching..." : `Pay ₹${checkoutItem.price} & Blend`}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* SUCCESS SCREEN */}
          {orderSuccess && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-6">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl">
                <div className="w-14 h-14 bg-emerald-500/20 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-2xl font-black mb-4">
                  ✔
                </div>
                <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400">Order Dispatched to KDS</span>
                <h2 className="text-3xl font-black text-white mt-1">#{orderSuccess.orderNumber}</h2>
                <p className="text-xs text-neutral-400 mt-2">
                  Blending has been cued on the counter screen. Walk down in <strong>2 minutes</strong>.
                </p>

                <div className="my-5 p-3.5 bg-neutral-950 rounded-xl border border-neutral-800 text-left text-xs space-y-1.5 font-mono">
                  <div className="flex justify-between text-neutral-400">
                    <span>Name:</span>
                    <span className="text-white font-bold">{orderSuccess.customerName}</span>
                  </div>
                  <div className="flex justify-between text-neutral-400">
                    <span>Style:</span>
                    <span className="text-cyan-400 font-bold">{orderSuccess.pickupType}</span>
                  </div>
                </div>

                <button
                  onClick={() => setOrderSuccess(null)}
                  className="w-full py-3 bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-bold rounded-xl transition"
                >
                  Order Another Drink
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CustomerApp />);
  </script>
</body>
</html>

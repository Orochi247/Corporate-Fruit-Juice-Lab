<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RCP Juice Lab — Desk Pre-Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const SIGNATURE_BLENDS = [
      {
        id: "sig_1",
        timeSlot: "09:00 AM",
        tagline: "Focus & Detox",
        name: "Morning Kickstart (ABC)",
        price: 130,
        calories: 145,
        sugar: 22,
        desc: "Crisp Apple, organic Beetroot, Carrot, cold-pressed Ginger & Lemon.",
        recipe: [
          { name: "Apple", grams: 100 },
          { name: "Beetroot", grams: 60 },
          { name: "Carrot", grams: 80 },
          { name: "Fresh Ginger & Lemon", grams: 10 }
        ]
      },
      {
        id: "sig_2",
        timeSlot: "01:30 PM",
        tagline: "Gut & Digestion Reset",
        name: "Post-Lunch Reset",
        price: 120,
        calories: 115,
        sugar: 17,
        desc: "Pineapple, cooling Cucumber, Fresh Mint sprigs, Himalayan Black Salt.",
        recipe: [
          { name: "Pineapple", grams: 140 },
          { name: "Cucumber", grams: 80 },
          { name: "Fresh Mint", grams: 5 },
          { name: "Himalayan Salt", grams: 2 }
        ]
      },
      {
        id: "sig_3",
        timeSlot: "04:00 PM",
        tagline: "Sustained No-Crash Energy",
        name: "Screen-Fatigue Shield",
        price: 140,
        calories: 125,
        sugar: 19,
        desc: "Valencia Orange, Sweet Carrot, Raw Haldi shot, Black Pepper, Chia Seeds.",
        recipe: [
          { name: "Valencia Orange", grams: 150 },
          { name: "Carrot", grams: 70 },
          { name: "Raw Turmeric & Pepper", grams: 5 },
          { name: "Chia Seeds", grams: 10 }
        ]
      },
      {
        id: "sig_4",
        timeSlot: "06:00 PM",
        tagline: "Post-Work Satiety & Recovery",
        name: "Gym & Commute Fuel",
        price: 160,
        calories: 220,
        sugar: 14,
        desc: "Curd / Greek Yogurt, Banana, Roasted Chana protein, Flax & Pumpkin seeds.",
        recipe: [
          { name: "Curd / Yogurt Base", grams: 150 },
          { name: "Banana", grams: 80 },
          { name: "Roasted Chana Powder", grams: 20 },
          { name: "Flax & Pumpkin Seeds", grams: 15 }
        ]
      }
    ];

    const INGREDIENTS_CATALOG = {
      bases: [
        { id: "b_orange", name: "Valencia Orange", caloriesPer100g: 47, sugarPer100g: 9, defaultGrams: 150 },
        { id: "b_mosambi", name: "Sweet Lime (Mosambi)", caloriesPer100g: 43, sugarPer100g: 8, defaultGrams: 150 },
        { id: "b_pineapple", name: "Pineapple", caloriesPer100g: 50, sugarPer100g: 10, defaultGrams: 140 },
        { id: "b_watermelon", name: "Watermelon", caloriesPer100g: 30, sugarPer100g: 6, defaultGrams: 180 },
        { id: "b_coconut", name: "Tender Coconut Water", caloriesPer100g: 19, sugarPer100g: 3.5, defaultGrams: 180 }
      ],
      mixins: [
        { id: "m_apple", name: "Green/Red Apple", caloriesPer100g: 52, sugarPer100g: 10, defaultGrams: 70 },
        { id: "m_beet", name: "Beetroot", caloriesPer100g: 43, sugarPer100g: 7, defaultGrams: 60 },
        { id: "m_carrot", name: "Carrot", caloriesPer100g: 41, sugarPer100g: 5, defaultGrams: 70 },
        { id: "m_cuke", name: "Cucumber", caloriesPer100g: 15, sugarPer100g: 2, defaultGrams: 80 },
        { id: "m_pome", name: "Pomegranate", caloriesPer100g: 83, sugarPer100g: 14, defaultGrams: 60 },
        { id: "m_spinach", name: "Baby Spinach", caloriesPer100g: 23, sugarPer100g: 0.4, defaultGrams: 30 }
      ],
      boosters: [
        { id: "bst_chia", name: "Soaked Chia Seeds (+₹25)", price: 25, caloriesPer100g: 486, defaultGrams: 10 },
        { id: "bst_seeds", name: "Flax & Pumpkin Seeds (+₹25)", price: 25, caloriesPer100g: 540, defaultGrams: 15 },
        { id: "bst_turm", name: "Raw Turmeric & Pepper (+₹15)", price: 15, caloriesPer100g: 40, defaultGrams: 5 },
        { id: "bst_protein", name: "Plant Protein Scoop (+₹40)", price: 40, caloriesPer100g: 380, defaultGrams: 20 }
      ]
    };

    function CustomerApp() {
      const [activeTab, setActiveTab] = useState("SIGNATURE");
      const [selectedBase, setSelectedBase] = useState(INGREDIENTS_CATALOG.bases[0]);
      const [selectedMixins, setSelectedMixins] = useState([INGREDIENTS_CATALOG.mixins[0]]);
      const [selectedBooster, setSelectedBooster] = useState(null);

      const [checkoutItem, setCheckoutItem] = useState(null);
      const [customerName, setCustomerName] = useState("");
      const [deskLocation, setDeskLocation] = useState("");
      const [pickupType, setPickupType] = useState("EXPRESS DESK");
      const [mealCardOption, setMealCardOption] = useState("ZETA");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(null);

      const customMetrics = useMemo(() => {
        let cal = (selectedBase.caloriesPer100g * selectedBase.defaultGrams) / 100;
        let sug = (selectedBase.sugarPer100g * selectedBase.defaultGrams) / 100;
        let price = 120;

        selectedMixins.forEach(m => {
          cal += (m.caloriesPer100g * m.defaultGrams) / 100;
          sug += (m.sugarPer100g * m.defaultGrams) / 100;
        });

        if (selectedBooster) {
          cal += (selectedBooster.caloriesPer100g * selectedBooster.defaultGrams) / 100;
          price += selectedBooster.price;
        }

        return {
          calories: Math.round(cal),
          sugar: Math.round(sug),
          price: price
        };
      }, [selectedBase, selectedMixins, selectedBooster]);

      const toggleMixin = (item) => {
        if (selectedMixins.some(m => m.id === item.id)) {
          setSelectedMixins(selectedMixins.filter(m => m.id !== item.id));
        } else if (selectedMixins.length < 2) {
          setSelectedMixins([...selectedMixins, item]);
        }
      };

      const handleStartCustomCheckout = () => {
        const recipeList = [
          { name: selectedBase.name, grams: selectedBase.defaultGrams },
          ...selectedMixins.map(m => ({ name: m.name, grams: m.defaultGrams }))
        ];
        if (selectedBooster) {
          recipeList.push({ name: selectedBooster.name.split(" (")[0], grams: selectedBooster.defaultGrams });
        }

        setCheckoutItem({
          targetTitle: `Custom (${selectedBase.name.split(" ")[0]} + ${selectedMixins.map(m => m.name.split(" ")[0]).join("/")})`,
          price: customMetrics.price,
          calories: customMetrics.calories,
          recipe: recipeList
        });
      };

      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        if (!customerName.trim()) return alert("Please enter your name");

        setIsSubmitting(true);
        // Relative URL so mobile phones route back to the host server
        const API_URL = window.API_ENDPOINT || "/api/orders";

        const orderPayload = {
          customerName: deskLocation ? `${customerName} (${deskLocation})` : customerName,
          pickupType: pickupType,
          targetTitle: checkoutItem.targetTitle,
          calories: checkoutItem.calories,
          recipe: checkoutItem.recipe
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(orderPayload)
          });
          const data = await res.json();
          if (data.success) {
            setOrderSuccess(data.order);
            setCheckoutItem(null);
          } else {
            throw new Error("Server rejected order");
          }
        } catch (err) {
          console.warn("[API Offline] Simulating successful order locally");
          setOrderSuccess({
            orderNumber: String(Math.floor(100 + Math.random() * 900)),
            customerName: orderPayload.customerName,
            pickupType: pickupType,
            targetTitle: checkoutItem.targetTitle
          });
          setCheckoutItem(null);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-neutral-950 pb-24 border-x border-neutral-900 shadow-2xl">
          {/* HEADER */}
          <header className="p-5 border-b border-neutral-900 bg-neutral-900/40 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span className="text-[10px] font-black uppercase tracking-widest text-emerald-400">RCP Campus Lab</span>
              </div>
              <h1 className="text-lg font-black tracking-tight text-white mt-0.5">Fresh Cold-Pressed</h1>
            </div>
            <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-[11px] font-bold text-neutral-300">
              ⚡ &lt;60s Pickup
            </div>
          </header>

          {/* MODE SELECTOR TABS */}
          <div className="p-4 bg-neutral-950 sticky top-[69px] z-20">
            <div className="grid grid-cols-2 p-1 bg-neutral-900 rounded-xl border border-neutral-800">
              <button
                onClick={() => setActiveTab("SIGNATURE")}
                className={`py-2 text-xs font-black rounded-lg transition ${
                  activeTab === "SIGNATURE" 
                    ? "bg-neutral-800 text-white shadow-md" 
                    : "text-neutral-400 hover:text-white"
                }`}
              >
                Workday Blends
              </button>
              <button
                onClick={() => setActiveTab("CUSTOM")}
                className={`py-2 text-xs font-black rounded-lg transition ${
                  activeTab === "CUSTOM" 
                    ? "bg-emerald-600 text-white shadow-md shadow-emerald-950" 
                    : "text-neutral-400 hover:text-white"
                }`}
              >
                Build Your Own 🧪
              </button>
            </div>
          </div>

          {/* TAB 1: SIGNATURE WORKDAY BLENDS */}
          {activeTab === "SIGNATURE" && (
            <div className="px-4 space-y-3.5">
              <p className="text-[11px] font-semibold text-neutral-400 px-1">
                Timed for your workday rhythm. No added sugar or ice.
              </p>

              {SIGNATURE_BLENDS.map((blend) => (
                <div 
                  key={blend.id}
                  className="p-4 rounded-2xl bg-neutral-900/70 border border-neutral-800/80 hover:border-neutral-700 transition flex flex-col justify-between"
                >
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                        {blend.timeSlot} • {blend.tagline}
                      </span>
                      <span className="text-sm font-black font-mono text-white">
                        ₹{blend.price}
                      </span>
                    </div>
                    <h3 className="text-base font-bold text-white mt-1.5">{blend.name}</h3>
                    <p className="text-xs text-neutral-400 mt-1 leading-relaxed">{blend.desc}</p>
                  </div>

                  <div className="mt-4 pt-3 border-t border-neutral-800/60 flex items-center justify-between">
                    <div className="text-[11px] font-mono text-neutral-400">
                      <strong>{blend.calories}</strong> kcal • <strong>{blend.sugar}g</strong> nat. sugars
                    </div>
                    <button
                      onClick={() => setCheckoutItem({
                        targetTitle: blend.name,
                        price: blend.price,
                        calories: blend.calories,
                        recipe: blend.recipe
                      })}
                      className="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-white text-xs font-bold rounded-lg border border-neutral-700 transition"
                    >
                      Pre-Order
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 2: MODULAR 3-STEP CUSTOMIZER */}
          {activeTab === "CUSTOM" && (
            <div className="px-4 space-y-6">
              {/* LIVE MACRO BAR */}
              <div className="p-3.5 rounded-xl bg-neutral-900 border border-neutral-800 flex items-center justify-between shadow-lg">
                <div>
                  <span className="text-[10px] uppercase font-bold text-neutral-400 tracking-wider">Live Profile</span>
                  <div className="flex items-baseline gap-2 mt-0.5">
                    <span className="text-xl font-black text-amber-400 font-mono">{customMetrics.calories}</span>
                    <span className="text-xs text-neutral-400">kcal</span>
                    <span className="text-neutral-600">•</span>
                    <span className="text-sm font-bold text-neutral-300 font-mono">{customMetrics.sugar}g</span>
                    <span className="text-xs text-neutral-400">sugars</span>
                  </div>
                </div>
                <div className="text-right">
                  <span className="text-[10px] uppercase font-bold text-neutral-400 tracking-wider">Total</span>
                  <p className="text-xl font-black text-white font-mono">₹{customMetrics.price}</p>
                </div>
              </div>

              {/* STEP 1: LIQUID BASE */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">1. Select Liquid Base (60%)</h4>
                  <span className="text-[10px] text-emerald-400 font-bold">Pick 1</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {INGREDIENTS_CATALOG.bases.map(b => (
                    <div
                      key={b.id}
                      onClick={() => setSelectedBase(b)}
                      className={`p-3 rounded-xl border text-left cursor-pointer transition select-none ${
                        selectedBase.id === b.id 
                          ? "bg-emerald-500/15 border-emerald-500 text-white font-bold" 
                          : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700"
                      }`}
                    >
                      <p className="text-xs leading-tight">{b.name}</p>
                      <span className="text-[10px] font-mono text-neutral-400 block mt-1">{b.caloriesPer100g} kcal/100g</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* STEP 2: MIX-INS */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">2. Select Mix-Ins (40%)</h4>
                  <span className="text-[10px] text-neutral-400 font-bold">{selectedMixins.length}/2 Selected</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {INGREDIENTS_CATALOG.mixins.map(m => {
                    const isSelected = selectedMixins.some(x => x.id === m.id);
                    return (
                      <div
                        key={m.id}
                        onClick={() => toggleMixin(m)}
                        className={`p-3 rounded-xl border text-left cursor-pointer transition select-none ${
                          isSelected 
                            ? "bg-emerald-500/15 border-emerald-500 text-white font-bold" 
                            : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700"
                        }`}
                      >
                        <p className="text-xs leading-tight">{m.name}</p>
                        <span className="text-[10px] font-mono text-neutral-400 block mt-1">{m.caloriesPer100g} kcal/100g</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* STEP 3: BOOSTERS */}
              <div>
                <div className="flex justify-between items-center mb-2 px-1">
                  <h4 className="text-xs font-black uppercase tracking-wider text-neutral-300">3. Superfood Booster</h4>
                  <span className="text-[10px] text-neutral-400 font-bold">Optional</span>
                </div>
                <div className="space-y-2">
                  {INGREDIENTS_CATALOG.boosters.map(bst => {
                    const isSelected = selectedBooster?.id === bst.id;
                    return (
                      <div
                        key={bst.id}
                        onClick={() => setSelectedBooster(isSelected ? null : bst)}
                        className={`p-3 rounded-xl border text-left cursor-pointer transition select-none flex justify-between items-center ${
                          isSelected 
                            ? "bg-amber-500/15 border-amber-500 text-white font-bold" 
                            : "bg-neutral-900/60 border-neutral-800 text-neutral-300 hover:border-neutral-700"
                        }`}
                      >
                        <span className="text-xs">{bst.name}</span>
                        <span className="text-[10px] font-mono text-neutral-400">+{bst.caloriesPer100g * bst.defaultGrams / 100} kcal</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* BOTTOM CTA */}
              <button
                onClick={handleStartCustomCheckout}
                disabled={selectedMixins.length === 0}
                className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 active:scale-98 disabled:opacity-50 text-white font-black text-sm uppercase tracking-wide rounded-xl shadow-xl shadow-emerald-950 transition"
              >
                Review &amp; Desk Pickup (₹{customMetrics.price})
              </button>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {checkoutItem && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-neutral-800 pb-4">
                  <div>
                    <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400">Confirm Order</span>
                    <h3 className="text-lg font-bold text-white mt-0.5">{checkoutItem.targetTitle}</h3>
                    <p className="text-xs font-mono text-neutral-400 mt-0.5">₹{checkoutItem.price} • {checkoutItem.calories} kcal</p>
                  </div>
                  <button onClick={() => setCheckoutItem(null)} className="text-neutral-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={handlePlaceOrder} className="mt-5 space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Your Name</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Rahul Sharma"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-sm text-white focus:outline-none focus:border-emerald-500 font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Office Bay / Floor (Optional)</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Building 4, Bay 2B"
                      value={deskLocation}
                      onChange={(e) => setDeskLocation(e.target.value)}
                      className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-sm text-white focus:outline-none focus:border-emerald-500 font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Pickup Style</label>
                    <div className="grid grid-cols-2 gap-2 mt-1.5">
                      <button
                        type="button"
                        onClick={() => setPickupType("EXPRESS DESK")}
                        className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition ${
                          pickupType === "EXPRESS DESK" 
                            ? "bg-cyan-500/20 text-cyan-300 border-cyan-500" 
                            : "bg-neutral-950 text-neutral-400 border-neutral-800"
                        }`}
                      >
                        ⚡ Express Rack (&lt;60s)
                      </button>
                      <button
                        type="button"
                        onClick={() => setPickupType("COUNTER PICKUP")}
                        className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition ${
                          pickupType === "COUNTER PICKUP" 
                            ? "bg-emerald-500/20 text-emerald-300 border-emerald-500" 
                            : "bg-neutral-950 text-neutral-400 border-neutral-800"
                        }`}
                      >
                        Counter Handover
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-300 uppercase tracking-wider">Payment Method</label>
                    <div className="grid grid-cols-3 gap-2 mt-1.5">
                      {["ZETA", "PLUXEE", "UPI"].map(m => (
                        <button
                          key={m}
                          type="button"
                          onClick={() => setMealCardOption(m)}
                          className={`py-2 rounded-lg border text-xs font-black transition ${
                            mealCardOption === m 
                              ? "bg-neutral-100 text-neutral-950 border-white" 
                              : "bg-neutral-950 text-neutral-400 border-neutral-800"
                          }`}
                        >
                          {m}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-4 mt-2 bg-emerald-600 hover:bg-emerald-500 active:scale-98 disabled:opacity-50 text-white font-black text-sm uppercase tracking-wide rounded-xl shadow-lg transition"
                  >
                    {isSubmitting ? "Dispatching..." : `Pay ₹${checkoutItem.price} & Blend`}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* SUCCESS SCREEN */}
          {orderSuccess && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-6">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl">
                <div className="w-14 h-14 bg-emerald-500/20 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-2xl font-black mb-4">
                  ✔
                </div>
                <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400">Order Dispatched to KDS</span>
                <h2 className="text-3xl font-black text-white mt-1">#{orderSuccess.orderNumber}</h2>
                <p className="text-xs text-neutral-400 mt-2">
                  Blending has been cued on the counter screen. Walk down in <strong>2 minutes</strong>.
                </p>

                <div className="my-5 p-3.5 bg-neutral-950 rounded-xl border border-neutral-800 text-left text-xs space-y-1.5 font-mono">
                  <div className="flex justify-between text-neutral-400">
                    <span>Name:</span>
                    <span className="text-white font-bold">{orderSuccess.customerName}</span>
                  </div>
                  <div className="flex justify-between text-neutral-400">
                    <span>Style:</span>
                    <span className="text-cyan-400 font-bold">{orderSuccess.pickupType}</span>
                  </div>
                </div>

                <button
                  onClick={() => setOrderSuccess(null)}
                  className="w-full py-3 bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-bold rounded-xl transition"
                >
                  Order Another Drink
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CustomerApp />);
  </script>
</body>
</html>

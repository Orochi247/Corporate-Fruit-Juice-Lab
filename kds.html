<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RCP Juice Bar — Kitchen Display System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans select-none antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Synthesizer (Zero asset dependencies, instant chime)
    const playOrderChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {
        console.warn("Audio Context blocked until initial user interaction");
      }
    };

    const INITIAL_INGREDIENTS = [
      { id: "ing_1", name: "Orange", category: "Base", available: true },
      { id: "ing_2", name: "Sweet Lime (Mosambi)", category: "Base", available: true },
      { id: "ing_3", name: "Pineapple", category: "Base", available: true },
      { id: "ing_4", name: "Watermelon", category: "Base", available: true },
      { id: "ing_5", name: "Apple", category: "Mix-in", available: true },
      { id: "ing_6", name: "Beetroot", category: "Mix-in", available: true },
      { id: "ing_7", name: "Carrot", category: "Mix-in", available: true },
      { id: "ing_8", name: "Cucumber", category: "Mix-in", available: true },
      { id: "ing_9", name: "Chia Seeds", category: "Booster", available: true },
      { id: "ing_10", name: "Flax-Pumpkin Seeds", category: "Booster", available: true },
      { id: "ing_11", name: "Ginger/Turmeric Shot", category: "Booster", available: true },
    ];

    const INITIAL_ORDERS = [
      {
        id: "ord_101",
        orderNumber: "101",
        customerName: "Rahul Sharma",
        pickupType: "EXPRESS DESK",
        type: "CUSTOM",
        targetTitle: "Digest & Reset Custom",
        status: "QUEUED",
        createdAt: Date.now() - 250000,
        calories: 125,
        recipe: [
          { name: "Pineapple", grams: 140 },
          { name: "Cucumber", grams: 80 },
          { name: "Fresh Mint", grams: 5 },
          { name: "Chia Seeds", grams: 10 }
        ]
      }
    ];

    function App() {
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [ingredients, setIngredients] = useState(INITIAL_INGREDIENTS);
      const [isStockModalOpen, setIsStockModalOpen] = useState(false);
      const [now, setNow] = useState(Date.now());
      const [connectionStatus, setConnectionStatus] = useState("CONNECTING");

      const wsRef = useRef(null);
      const reconnectTimeoutRef = useRef(null);

      // 1-Second Clock for Urgency Timers
      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Dynamic Auto-Reconnecting WebSocket Client
      const connectWebSocket = () => {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host || "localhost:4000";
        const WS_URL = window.WS_ENDPOINT || `${protocol}//${host}/kds-stream`;

        setConnectionStatus("CONNECTING");

        try {
          const ws = new WebSocket(WS_URL);
          wsRef.current = ws;

          ws.onopen = () => {
            console.log("[KDS WS] Connected to backend.");
            setConnectionStatus("CONNECTED");
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data.type === "INIT_QUEUE" && Array.isArray(data.orders)) {
                if (data.orders.length > 0) setOrders(data.orders);
              } else if (data.type === "ORDER_CREATED" && data.order) {
                setOrders((prev) => [data.order, ...prev.filter(o => o.id !== data.order.id)]);
                playOrderChime();
              } else if (data.type === "ORDER_UPDATED" && data.order) {
                setOrders((prev) =>
                  prev.map((o) => (o.id === data.order.id ? { ...o, ...data.order } : o))
                );
              } else if (data.type === "STOCK_CHANGED") {
                setIngredients((prev) =>
                  prev.map((item) =>
                    item.id === data.ingredientId ? { ...item, available: data.available } : item
                  )
                );
              }
            } catch (err) {
              console.error("[KDS WS] Failed to parse message:", err);
            }
          };

          ws.onclose = () => {
            setConnectionStatus("OFFLINE");
            reconnectTimeoutRef.current = setTimeout(connectWebSocket, 4000);
          };

          ws.onerror = () => {
            ws.close();
          };
        } catch (e) {
          setConnectionStatus("OFFLINE");
          reconnectTimeoutRef.current = setTimeout(connectWebSocket, 4000);
        }
      };

      useEffect(() => {
        connectWebSocket();
        return () => {
          if (wsRef.current) wsRef.current.close();
          if (reconnectTimeoutRef.current) clearTimeout(reconnectTimeoutRef.current);
        };
      }, []);

      // Advance Status (QUEUED -> BLENDING -> READY -> COLLECTED)
      const advanceOrderStatus = (orderId) => {
        const targetOrder = orders.find(o => o.id === orderId);
        if (!targetOrder) return;

        let nextStatus = "BLENDING";
        if (targetOrder.status === "QUEUED") nextStatus = "BLENDING";
        else if (targetOrder.status === "BLENDING") {
          console.log(`[ESC/POS PRINT] Sticker printed for #${targetOrder.orderNumber} (${targetOrder.customerName})`);
          nextStatus = "READY";
        } else if (targetOrder.status === "READY") {
          nextStatus = "COLLECTED";
        }

        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));

        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({
            type: "UPDATE_STATUS",
            orderId: orderId,
            status: nextStatus
          }));
        }
      };

      // Toggle Ingredients In/Out of Stock
      const toggleStock = (id) => {
        const item = ingredients.find(i => i.id === id);
        if (!item) return;
        const newAvailability = !item.available;

        setIngredients(prev => prev.map(i => i.id === id ? { ...i, available: newAvailability } : i));

        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({
            type: "TOGGLE_STOCK",
            ingredientId: id,
            available: newAvailability
          }));
        }
      };

      // Manual Simulator Button
      const simulateIncomingOrder = () => {
        const randomNum = Math.floor(104 + Math.random() * 800);
        const newOrder = {
          id: `ord_${Date.now()}`,
          orderNumber: `${randomNum}`,
          customerName: ["Vikram M.", "Sneha P.", "Aniket D.", "Tanvi K."][Math.floor(Math.random() * 4)],
          pickupType: Math.random() > 0.4 ? "EXPRESS DESK" : "COUNTER PICKUP",
          type: "CUSTOM",
          targetTitle: "Afternoon Cleanse Custom",
          status: "QUEUED",
          createdAt: Date.now(),
          calories: 130,
          recipe: [
            { name: "Sweet Lime (Mosambi)", grams: 160 },
            { name: "Pomegranate", grams: 60 },
            { name: "Chia Seeds", grams: 10 }
          ]
        };

        setOrders(prev => [newOrder, ...prev]);
        playOrderChime();
      };

      const activeOrders = orders.filter(o => o.status !== "COLLECTED");
      const readyCount = orders.filter(o => o.status === "READY").length;

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-neutral-950">
          {/* TOP BAR */}
          <header className="h-16 border-b border-neutral-800 bg-neutral-900/80 px-6 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">
                <div className={`w-3.5 h-3.5 rounded-full ${
                  connectionStatus === "CONNECTED" 
                    ? "bg-emerald-500 animate-pulse" 
                    : connectionStatus === "CONNECTING" 
                    ? "bg-amber-500 animate-bounce" 
                    : "bg-red-500"
                }`}></div>
                <h1 className="text-xl font-black tracking-tight text-white uppercase">
                  RCP Counter KDS
                </h1>
                <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${
                  connectionStatus === "CONNECTED"
                    ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                    : connectionStatus === "CONNECTING"
                    ? "bg-amber-500/10 text-amber-400 border-amber-500/30"
                    : "bg-red-500/10 text-red-400 border-red-500/30"
                }`}>
                  {connectionStatus}
                </span>
              </div>

              <div className="flex items-center gap-2 text-xs font-semibold text-neutral-400">
                <span className="bg-neutral-800 px-3 py-1 rounded-md border border-neutral-700">
                  Active: <strong className="text-white text-sm">{activeOrders.length}</strong>
                </span>
                <span className="bg-neutral-800 px-3 py-1 rounded-md border border-neutral-700">
                  Ready on Rack: <strong className="text-emerald-400 text-sm">{readyCount}</strong>
                </span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={simulateIncomingOrder}
                className="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-xs font-semibold rounded-lg border border-neutral-600 transition"
              >
                + Simulate Desk Order
              </button>
              <button 
                onClick={() => setIsStockModalOpen(true)}
                className="px-4 py-2 bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 text-amber-400 border border-amber-500/40 text-xs font-bold rounded-lg transition flex items-center gap-2"
              >
                Manage Stock ({ingredients.filter(i => !i.available).length} Out)
              </button>
            </div>
          </header>

          {/* MAIN HORIZONTAL QUEUE */}
          <main className="flex-1 p-6 overflow-x-auto overflow-y-hidden">
            <div className="flex gap-5 h-full items-start">
              {activeOrders.length === 0 ? (
                <div className="m-auto text-center text-neutral-500 font-medium">
                  <p className="text-2xl mb-1">Queue is Clear</p>
                  <p className="text-sm">New orders from desk QR codes will chime automatically.</p>
                </div>
              ) : (
                activeOrders.map(order => {
                  const elapsedSec = Math.floor((now - order.createdAt) / 1000);
                  const mins = Math.floor(elapsedSec / 60);
                  const secs = elapsedSec % 60;
                  const timeFormatted = `${mins}:${secs < 10 ? "0" : ""}${secs}`;

                  let urgencyClass = "border-emerald-500/40 bg-neutral-900";
                  let badgeBg = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                  if (elapsedSec >= 240) {
                    urgencyClass = "border-red-500 bg-red-950/20 ring-1 ring-red-500";
                    badgeBg = "bg-red-500 text-white animate-pulse-fast";
                  } else if (elapsedSec >= 120) {
                    urgencyClass = "border-amber-500/60 bg-neutral-900";
                    badgeBg = "bg-amber-500/20 text-amber-300 border-amber-500/40";
                  }

                  return (
                    <div 
                      key={order.id}
                      className={`w-[340px] shrink-0 h-full flex flex-col rounded-2xl border-2 ${urgencyClass} overflow-hidden shadow-2xl transition-all duration-200`}
                    >
                      {/* CARD HEADER */}
                      <div className="p-4 bg-neutral-900 border-b border-neutral-800 flex justify-between items-start">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-3xl font-black tracking-tight text-white">
                              #{order.orderNumber}
                            </span>
                            <span className={`text-[10px] uppercase tracking-wider font-extrabold px-2 py-0.5 rounded border ${
                              order.pickupType === "EXPRESS DESK" 
                                ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" 
                                : "bg-neutral-800 text-neutral-300 border-neutral-700"
                            }`}>
                              {order.pickupType}
                            </span>
                          </div>
                          <p className="text-sm font-semibold text-neutral-300 mt-0.5 truncate w-44">
                            {order.customerName}
                          </p>
                        </div>

                        <div className={`px-2.5 py-1 rounded-lg text-xs font-mono font-black border ${badgeBg}`}>
                          {timeFormatted}
                        </div>
                      </div>

                      {/* BLEND TITLE & CALORIES */}
                      <div className="px-4 py-2.5 bg-neutral-850/60 border-b border-neutral-800 flex justify-between items-center text-xs">
                        <span className="font-bold text-neutral-200 truncate pr-2">
                          {order.targetTitle}
                        </span>
                        <span className="text-neutral-400 font-mono shrink-0">
                          {order.calories} kcal
                        </span>
                      </div>

                      {/* RECIPE GRAMS */}
                      <div className="flex-1 p-4 overflow-y-auto space-y-2 bg-neutral-950/40">
                        {order.recipe.map((item, idx) => (
                          <div 
                            key={idx} 
                            className="flex items-center justify-between p-2.5 rounded-lg bg-neutral-900/90 border border-neutral-800"
                          >
                            <span className="text-base font-bold text-neutral-200">
                              {item.name}
                            </span>
                            <span className="text-lg font-black font-mono text-amber-400 bg-amber-400/10 px-2.5 py-0.5 rounded">
                              {item.grams}g
                            </span>
                          </div>
                        ))}
                      </div>

                      {/* ACTION BUTTON */}
                      <div className="p-3 bg-neutral-900 border-t border-neutral-800">
                        {order.status === "QUEUED" && (
                          <button
                            onClick={() => advanceOrderStatus(order.id)}
                            className="w-full py-3.5 bg-neutral-800 hover:bg-neutral-700 active:scale-98 text-white font-black text-sm uppercase tracking-wide rounded-xl border border-neutral-600 transition flex items-center justify-center gap-2"
                          >
                            <span>▶ Start Blending</span>
                          </button>
                        )}

                        {order.status === "BLENDING" && (
                          <button
                            onClick={() => advanceOrderStatus(order.id)}
                            className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white font-black text-sm uppercase tracking-wide rounded-xl shadow-lg shadow-emerald-950 transition flex items-center justify-center gap-2"
                          >
                            <span>✔ Mark Ready & Print</span>
                          </button>
                        )}

                        {order.status === "READY" && (
                          <button
                            onClick={() => advanceOrderStatus(order.id)}
                            className="w-full py-3.5 bg-cyan-700 hover:bg-cyan-600 active:scale-98 text-white font-black text-sm uppercase tracking-wide rounded-xl transition"
                          >
                            <span>Handover to Customer</span>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </main>

          {/* OUT-OF-STOCK MODAL */}
          {isStockModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
                <div className="p-5 border-b border-neutral-800 flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-white">Counter Stock Manager</h2>
                    <p className="text-xs text-neutral-400">Toggling an ingredient immediately updates customer desk ordering.</p>
                  </div>
                  <button 
                    onClick={() => setIsStockModalOpen(false)}
                    className="p-2 text-neutral-400 hover:text-white text-xl font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 overflow-y-auto grid grid-cols-2 gap-3">
                  {ingredients.map(ing => (
                    <div 
                      key={ing.id}
                      onClick={() => toggleStock(ing.id)}
                      className={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition select-none ${
                        ing.available 
                          ? "bg-neutral-800 border-neutral-700 text-white" 
                          : "bg-red-950/30 border-red-800/60 text-red-300 opacity-80"
                      }`}
                    >
                      <div>
                        <p className="font-bold text-sm">{ing.name}</p>
                        <p className="text-[10px] text-neutral-400 uppercase tracking-wider">{ing.category}</p>
                      </div>
                      <span className={`text-xs font-black px-2.5 py-1 rounded-md ${
                        ing.available 
                          ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" 
                          : "bg-red-500/20 text-red-400 border border-red-500/40"
                      }`}>
                        {ing.available ? "IN STOCK" : "OUT"}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="p-4 border-t border-neutral-800 flex justify-end">
                  <button 
                    onClick={() => setIsStockModalOpen(false)}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition"
                  >
                    Done & Apply
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
